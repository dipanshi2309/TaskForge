spring:
  application:
    name: taskforge-backend
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:h2:mem:taskforgedb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE}
    driver-class-name: ${SPRING_DATASOURCE_DRIVER_CLASS_NAME:org.h2.Driver}
    username: ${SPRING_DATASOURCE_USERNAME:sa}
    password: ${SPRING_DATASOURCE_PASSWORD:}
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: false
  h2:
    console:
      enabled: true
      path: /h2-console
  flyway:
    enabled: false # Enabled in PostgreSQL profile

server:
  port: 8080

taskforge:
  worker:
    id: ${WORKER_ID:worker-alpha-1}
    max-concurrency: ${WORKER_MAX_CONCURRENCY:8}
  rabbitmq:
    listener:
      enabled: false

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always
