version: '3.8'

services:
  taskforge-postgres:
    image: postgres:16-alpine
    container_name: taskforge-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: taskforge
      POSTGRES_USER: taskforge
      POSTGRES_PASSWORD: taskforge_secret_password
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U taskforge -d taskforge"]
      interval: 5s
      timeout: 5s
      retries: 5

  taskforge-rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: taskforge-rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: taskforge
      RABBITMQ_DEFAULT_PASS: taskforge_rabbit_password
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  taskforge-backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: taskforge-backend
    restart: unless-stopped
    depends_on:
      taskforge-postgres:
        condition: service_healthy
      taskforge-rabbitmq:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://taskforge-postgres:5432/taskforge
      SPRING_DATASOURCE_USERNAME: taskforge
      SPRING_DATASOURCE_PASSWORD: taskforge_secret_password
      SPRING_RABBITMQ_HOST: taskforge-rabbitmq
      SPRING_RABBITMQ_PORT: 5672
      SPRING_RABBITMQ_USERNAME: taskforge
      SPRING_RABBITMQ_PASSWORD: taskforge_rabbit_password
      TASKFORGE_WORKER_ID: worker-node-1
      TASKFORGE_WORKER_MAX_CONCURRENCY: 10
    ports:
      - "8080:8080"

  taskforge-frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: taskforge-frontend
    restart: unless-stopped
    depends_on:
      - taskforge-backend
    ports:
      - "3000:80"

  prometheus:
    image: prom/prometheus:v2.51.0
    container_name: taskforge-prometheus
    restart: unless-stopped
    volumes:
      - ./infrastructure/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
    ports:
      - "9090:9090"

  grafana:
    image: grafana/grafana:10.4.0
    container_name: taskforge-grafana
    restart: unless-stopped
    ports:
      - "3001:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin

volumes:
  pgdata:
